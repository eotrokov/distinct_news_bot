[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distinct-news-bot"
version = "0.1.0"
description = "Telegram bot that aggregates news from user-defined sources without duplicates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.6",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "fuzzywuzzy>=0.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]
sumy = [
  "sumy>=0.11.0",
  "nltk>=3.9",
]
ml = [
  "python-Levenshtein>=0.25.0",
  "scikit-learn>=1.5.0",
  "numpy>=1.26.0",
]

[project.scripts]
distinct-news-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
