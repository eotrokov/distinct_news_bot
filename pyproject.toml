[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distinct-news-bot"
version = "0.1.0"
description = "Telegram bot that aggregates news from public Telegram channels without duplicates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "feedparser>=6.0.11",
  "starlette>=0.38",
  "jinja2>=3.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
distinct-news-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*", "dashboard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
