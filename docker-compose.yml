services:
  bot:
    build: .
    image: distinct-news-bot:latest
    container_name: distinct-news-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_DB: /app/data/bot.sqlite3
    volumes:
      - bot-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib; raise SystemExit(0 if pathlib.Path('/app/data').exists() else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
