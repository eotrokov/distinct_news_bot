name: Fetch bot logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: "157.228.155.21"
      DEPLOY_USER: "root"
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Dump remote bot status and logs
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PASSWORD_FALLBACK: "7gZx%prTU}GCM>b="
        run: |
          if [ -z "${DEPLOY_SSH_PASSWORD}" ]; then
            export DEPLOY_SSH_PASSWORD="${DEPLOY_SSH_PASSWORD_FALLBACK}"
          fi
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/distinct-news-bot}"
          DEPLOY_SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          export SSHPASS="$DEPLOY_SSH_PASSWORD"
          SSH=(sshpass -e ssh -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no)
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          "${SSH[@]}" "$REMOTE" "cd $(printf %q "$DEPLOY_PATH") && \
            echo '=== compose ps ===' && docker compose ps && \
            echo '=== restart count / status ===' && \
            docker inspect distinct-news-bot --format 'restarts={{.RestartCount}} status={{.State.Status}} OOM={{.State.OOMKilled}} exit={{.State.ExitCode}} error={{.State.Error}}' && \
            echo '=== last 200 bot log lines ===' && \
            docker compose logs --tail=200 --timestamps bot && \
            echo '=== error/warn subset ===' && \
            docker compose logs --tail=500 bot 2>&1 | grep -Ei 'error|exception|traceback|conflict|failed|warning' | tail -80 || true"
