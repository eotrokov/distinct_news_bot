name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_KEY_RAW: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required deploy secrets
        run: |
          test -n "${DEPLOY_HOST}" || { echo "DEPLOY_HOST secret is required"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "DEPLOY_USER secret is required"; exit 1; }
          test -n "${DEPLOY_SSH_KEY_RAW}" || { echo "DEPLOY_SSH_KEY secret is required"; exit 1; }

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          # Normalize multiline key: strip wrapping quotes, CRLF → LF, ensure trailing newline.
          printf '%s' "$DEPLOY_SSH_KEY_RAW" \
            | sed -e 's/\r$//' -e "s/^['\"]//" -e "s/['\"]$//" \
            > ~/.ssh/deploy_key
          # If the secret was stored with literal \n, expand them.
          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            printf '%s' "$DEPLOY_SSH_KEY_RAW" | sed 's/\\n/\n/g' | sed -e 's/\r$//' > ~/.ssh/deploy_key
          fi
          # Ensure file ends with a newline (OpenSSH requires it).
          [ -n "$(tail -c1 ~/.ssh/deploy_key)" ] && printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY does not look like a private key (missing BEGIN PRIVATE KEY)" >&2
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Run remote deploy
        run: |
          export DEPLOY_SSH_KEY=~/.ssh/deploy_key
          ./deploy/deploy.sh
