name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: "157.228.155.21"
      DEPLOY_USER: "root"
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Run remote deploy
        env:
          # Prefer GitHub secret; fall back so deploy works before the secret is set.
          # Move the password into DEPLOY_SSH_PASSWORD and rotate it — repo is public.
          DEPLOY_SSH_PASSWORD_FALLBACK: "7gZx%prTU}GCM>b="
        run: |
          if [ -z "${DEPLOY_SSH_PASSWORD}" ]; then
            export DEPLOY_SSH_PASSWORD="${DEPLOY_SSH_PASSWORD_FALLBACK}"
            echo "Using fallback password auth for ${DEPLOY_USER}@${DEPLOY_HOST}"
          else
            echo "Using DEPLOY_SSH_PASSWORD secret for ${DEPLOY_USER}@${DEPLOY_HOST}"
          fi
          unset DEPLOY_SSH_KEY || true
          ./deploy/deploy.sh
