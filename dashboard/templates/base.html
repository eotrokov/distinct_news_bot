<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Distinct News{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5c6670;
      --border: #d8dee4;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --card: #1a2332;
        --text: #e8edf2;
        --muted: #9aa7b5;
        --border: #2d3a4a;
        --accent: #60a5fa;
        --accent-soft: #1e3a5f;
      }
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      word-break: break-word;
    }
    nav {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.25rem 0;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    nav a:hover { text-decoration: underline; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      min-width: 0;
    }
    .card .label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .card .value {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 0.25rem;
      word-break: break-word;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 720px;
    }
    th, td {
      padding: 0.65rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: var(--accent-soft);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th a.sort-link {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
      white-space: nowrap;
      min-height: 44px;
    }
    th a.sort-link:hover { text-decoration: underline; }
    th a.sort-link.is-active { color: var(--accent); }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: var(--accent-soft);
      color: var(--accent);
      margin-left: 0.25rem;
    }
    .section-title {
      margin: 0 0 1rem;
      font-size: 1.1rem;
    }
    .sort-bar {
      display: none;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 1rem;
    }
    .sort-bar a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .sort-bar a.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .table-hint {
      display: none;
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      header {
        padding: 0.85rem 1rem;
      }
      header h1 {
        font-size: 1.05rem;
      }
      main {
        padding: 1rem;
      }
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }
      .card {
        padding: 0.85rem 0.9rem;
      }
      .card .label {
        font-size: 0.72rem;
      }
      .card .value {
        font-size: 1.4rem;
      }
      .section-title {
        font-size: 1rem;
      }
      .sort-bar { display: flex; }
      .table-hint { display: block; }
      .table-wrap {
        border: none;
        background: transparent;
        overflow: visible;
      }
      table {
        min-width: 0;
        border: none;
        background: transparent;
      }
      thead { display: none; }
      tbody {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      tr {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.35rem 0;
        overflow: hidden;
      }
      td {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        border-bottom: 1px solid var(--border);
        padding: 0.55rem 0.85rem;
        text-align: right;
        word-break: break-word;
      }
      td:last-child { border-bottom: none; }
      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        text-align: left;
        flex: 0 0 42%;
        max-width: 42%;
      }
      td .badge { margin-left: 0.35rem; }
    }

    @media (max-width: 380px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Distinct News — статистика</h1>
    <nav>
      <a href="/">Обзор</a>
      <a href="/users">Пользователи</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
